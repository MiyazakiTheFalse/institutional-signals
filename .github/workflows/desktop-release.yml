name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            artifact: windows
          - name: macOS
            runner: macos-latest
            artifact: macos
          - name: Linux
            runner: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check repository hygiene
        run: python scripts/quality_gate.py
      - name: Verify curated dataset
        run: python scripts/build_data.py --check
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run desktop and cloud tests
        run: node --test desktop/test-validation.cjs desktop/test-provenance.cjs cloud/test-worker.mjs
      - name: Build web assets
        run: npm run build
      - name: Package desktop applications
        run: npx electron-builder --config electron-builder.cjs --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: institutional-signals-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: institutional-signals-*
          path: packages
          merge-multiple: true
      - name: Create tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" packages/* --title "Institutional Signals ${GITHUB_REF_NAME}" --generate-notes --draft
