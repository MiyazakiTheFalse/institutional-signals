name: Validate and build
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check repository hygiene
        run: python scripts/quality_gate.py
      - run: python scripts/build_data.py --check
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: node --test desktop/test-validation.cjs desktop/test-provenance.cjs cloud/test-worker.mjs
      - run: npm run build
