name: Build desktop installers
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['desktop/**', 'electron-builder.cjs', 'package.json', 'package-lock.json', 'src/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
            label: windows-x64
          - os: macos-latest
            args: --mac --arm64 --x64
            label: mac-universal-downloads
          - os: ubuntu-latest
            args: --linux --x64
            label: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm ls electron electron-builder csv-parse
      - run: node --test desktop/test-validation.cjs desktop/test-provenance.cjs cloud/test-worker.mjs
      - run: npm run build
      - if: runner.os != 'Linux'
        run: npx electron . --smoke-test
      - run: npx electron-builder --config electron-builder.cjs ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: institutional-signals-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          retention-days: 1
