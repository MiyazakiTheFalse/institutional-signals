# This job verifies curated records only. It does not currently fetch new events.
name: Weekly dataset integrity check
on:
  schedule:
    - cron: '29 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python scripts/build_data.py --check
      - run: python -m unittest discover -s tests -v
