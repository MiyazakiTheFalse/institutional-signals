name: Verify official source alternatives
on:
  workflow_dispatch:
  push:
    branches: [main, feat/official-source-routes-access-health]
    paths:
      - scripts/probe_routes.py
      - config/collection.json
      - .github/workflows/source-routes.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/probe_routes.py
