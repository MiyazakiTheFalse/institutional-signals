name: Verify official source alternatives
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_routes.py
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/probe_routes.py
