name: Bootstrap npm lockfile (one-time)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-lockfile.yml']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate missing npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          if test -f package-lock.json; then
            echo "Lockfile already present; no branch needed."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c chore/npm-lockfile-build-20261115
          git add package-lock.json
          git commit -m "build: pin npm dependency graph from Node 24"
          git push -u origin HEAD
